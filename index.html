<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 팀 AI 네컷 만화 제작소</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Noto Sans KR', 'sans-serif'], comic: ['Jua', 'sans-serif'] }, animation: { 'bounce-slight': 'bounce 2s infinite' } } } }
    </script>
    <style> body { font-family: 'Noto Sans KR', sans-serif; } .comic-font { font-family: 'Jua', sans-serif; } #loadingOverlay { backdrop-filter: blur(4px); } .break-keep-words { word-break: break-all; white-space: normal; } </style>
</head>
<body class="flex flex-col min-h-full text-slate-800 pb-20 selection:bg-indigo-100">

    <header class="bg-white border-b border-indigo-100 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-md"><i class="fa-solid fa-book-open"></i></div>
                <div><h1 class="comic-font text-2xl text-indigo-900 tracking-tight">우리 팀 AI 네컷 만화 제작소</h1><p class="text-xs text-slate-500 font-medium">경영지원본부 일의 의미 찾기 프로젝트</p></div>
            </div>
            <button onclick="openParticipationModal()" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold py-2 px-4 rounded-full shadow-sm transition-colors flex items-center gap-2"><i class="fa-solid fa-chart-pie text-indigo-500"></i> 조직 참여 현황</button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 flex flex-col space-y-6">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6">
                <div class="mb-5 pb-4 border-b border-slate-100"><h2 class="comic-font text-xl text-indigo-900 flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-indigo-500"></i> 콘티 작성하기</h2></div>
                <form id="comicForm" class="space-y-6">
                    <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 space-y-4">
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">웹툰 제목 <span class="text-rose-500">*</span></label><input type="text" id="webtoonTitle" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold placeholder-slate-400" placeholder="예: 영수증과의 전쟁"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-xs font-bold text-slate-600 mb-1">소속 팀명 <span class="text-rose-500">*</span></label><select id="teamName" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm"><option value="" disabled selected>팀을 선택하세요</option></select></div>
                            <div><label class="block text-xs font-bold text-slate-600 mb-1">작성자 이름 <span class="text-rose-500">*</span></label><input type="text" id="authorName" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm placeholder-slate-400" placeholder="예: 이다해"></div>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div><h3 class="text-xs font-bold text-slate-700 mb-2">#1컷</h3><div class="space-y-2"><input type="text" id="scene1" required class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="상황: 산더미 같은 영수증 앞의 멘붕"><textarea id="dialogue1" required class="w-full px-3 py-2 border rounded-lg text-xs" rows="2" placeholder="대사: 이거 언제 다 처리하지?"></textarea></div></div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div><h3 class="text-xs font-bold text-slate-700 mb-2">#2컷</h3><div class="space-y-2"><input type="text" id="scene2" required class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="상황: 불꽃 타이핑"><textarea id="dialogue2" required class="w-full px-3 py-2 border rounded-lg text-xs" rows="2" placeholder="대사: 타타탁! 스피드가 생명!"></textarea></div></div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div><h3 class="text-xs font-bold text-slate-700 mb-2">#3컷</h3><div class="space-y-2"><input type="text" id="scene3" required class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="상황: 에러창을 보고 절망"><textarea id="dialogue3" required class="w-full px-3 py-2 border rounded-lg text-xs" rows="2" placeholder="대사: 앗! 저장 안 했는데!"></textarea></div></div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div><h3 class="text-xs font-bold text-slate-700 mb-2">#4컷</h3><div class="space-y-2"><input type="text" id="scene4" required class="w-full px-3 py-2 border rounded-lg text-xs" placeholder="상황: 결국 완성하고 뿌듯해하는 표정"><textarea id="dialogue4" required class="w-full px-3 py-2 border rounded-lg text-xs" rows="2" placeholder="대사: 오늘도 무사히 완료!"></textarea></div></div>
                    </div>
                    <button type="submit" id="generateBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg"><i class="fa-solid fa-wand-magic-sparkles"></i> AI로 4컷 만화 생성하기</button>
                </form>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col space-y-4">
            <div class="bg-white rounded-2xl shadow-lg border border-slate-100 p-6 h-full flex flex-col relative">
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-100">
                    <h2 class="comic-font text-xl text-indigo-900 flex items-center gap-2"><i class="fa-regular fa-image text-indigo-500"></i> 결과물 미리보기</h2>
                    <button id="publishBtn" onclick="publishToGallery()" class="hidden bg-emerald-500 text-white text-sm font-bold py-2 px-4 rounded-lg"><i class="fa-solid fa-check"></i> 갤러리에 전시하기</button>
                </div>
                <div id="previewArea" class="flex-grow flex items-center justify-center bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl relative overflow-hidden min-h-[500px] p-2 md:p-6">
                    <div id="emptyState" class="text-center text-slate-400 p-6"><i class="fa-regular fa-face-smile-wink text-5xl mb-3"></i><p>폼을 작성하면 웹툰이 완성됩니다!</p></div>
                    <div id="comicGrid" class="hidden w-full h-full flex-col items-center">
                        <div class="text-center mb-5"><h3 id="previewTitle" class="comic-font text-2xl text-slate-800 mb-3 break-keep-words"></h3><div class="flex gap-2"><span id="previewTeamLabel" class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-full"></span><span id="previewAuthorLabel" class="bg-slate-200 text-slate-700 text-xs px-3 py-1 rounded-full"></span></div></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-2xl bg-slate-800 p-3 rounded-xl shadow-2xl">
                            <script>
                                for(let i=1; i<=4; i++) {
                                    document.write(`
                                    <div class="flex flex-col bg-white rounded-lg border-2 border-slate-700 h-full">
                                        <div class="bg-indigo-50/80 p-2 relative flex items-center justify-center h-14 overflow-hidden"><span class="absolute top-1.5 left-1.5 bg-amber-400 text-[10px] font-black px-1.5 py-0.5 rounded-sm">#${i}</span><span id="preview-scene-${i}" class="text-[10px] sm:text-xs font-bold text-center w-full pl-5 pr-1 line-clamp-2"></span></div>
                                        <div class="w-full bg-slate-200 shrink-0"><img id="preview-img-${i}" class="w-full h-auto aspect-square object-cover" src=""></div>
                                        <div class="p-2 border-t h-20 flex items-center justify-center overflow-hidden"><p id="preview-dialogue-${i}" class="comic-font text-[10px] sm:text-sm text-center w-full line-clamp-3"></p></div>
                                    </div>`);
                                }
                            </script>
                        </div>
                    </div>
                    <div id="loadingOverlay" class="absolute inset-0 bg-white/90 z-20 hidden flex-col items-center justify-center"><i class="fa-solid fa-palette text-6xl text-purple-600 animate-pulse mb-6"></i><p class="comic-font text-xl">AI 작가가 스케치하는 중...</p></div>
                </div>
            </div>
        </section>

        <section class="lg:col-span-12 mt-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                <div class="flex justify-between items-end mb-6 pb-4 border-b border-slate-100">
                    <h2 class="comic-font text-2xl text-slate-800"><i class="fa-solid fa-images text-amber-500"></i> AI 4컷 만화 갤러리</h2>
                </div>
                <div id="galleryGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                    <div id="emptyGalleryMsg" class="col-span-full flex flex-col items-center justify-center text-slate-400 py-16 bg-slate-50 rounded-xl border-2 border-dashed"><i class="fa-solid fa-spinner animate-spin text-4xl mb-3"></i><p>사내 갤러리 작품을 불러오는 중입니다...</p></div>
                </div>
                <div id="loadMoreContainer" class="hidden flex justify-center mt-10">
                    <button onclick="renderGalleryPage()" class="border-2 border-indigo-100 text-indigo-600 font-bold py-3 px-8 rounded-full">더 많은 작품 감상하기</button>
                </div>
            </div>
        </section>
    </main>

    <div id="participationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60"><div class="bg-white rounded-2xl max-w-3xl w-full mx-4 flex flex-col max-h-[80vh] overflow-hidden"><div class="px-6 py-4 flex justify-between items-center"><h3 class="comic-font text-2xl"><i class="fa-solid fa-chart-pie"></i> 조직 참여 현황</h3><button onclick="closeParticipationModal()"><i class="fa-solid fa-xmark text-2xl"></i></button></div><div class="p-6 overflow-y-auto flex-grow"><div class="mb-8"><div class="flex items-center gap-2 mb-4"><h4 class="font-bold text-lg">참여 완료 팀</h4><span id="participatedCount" class="bg-emerald-100 text-emerald-800 text-xs px-2 rounded-full">0</span></div><div id="participatedList" class="flex flex-wrap gap-2"></div></div><div><div class="flex items-center gap-2 mb-4"><h4 class="font-bold text-lg">미참여 팀</h4><span id="notParticipatedCount" class="bg-slate-100 text-slate-600 text-xs px-2 rounded-full">0</span></div><div id="notParticipatedList" class="flex flex-wrap gap-2"></div></div></div></div></div>
    <div id="messageBox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/50"><div class="bg-white p-6 rounded-2xl max-w-sm w-full mx-4 text-center"><i id="msgIcon" class="fa-solid fa-circle-check text-4xl mb-4"></i><p id="msgText" class="font-medium mb-6 text-lg"></p><button onclick="closeMessage()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl">확인</button></div></div>

    <script>
        const API_KEY = "AQ.Ab8RN6K-fHViaREbdkLESPpl9-14eyaGUwIbD4GLmUzRb6ya8Q"; 
        const POST_URL = "https://defaultf8d5ac988fa943558cd984f322fb0a.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/8fdff1b1f0914475ad179f60b5297392/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uAsxQaH-D8rbf5Ax7U6iK7anSL54EbMcAKLRAIaTiAM";
        const GET_URL = "https://defaultf8d5ac988fa943558cd984f322fb0a.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/00/workflows/c827f633f43249d29cb4117e1ef25621/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EmAb43RxVmaMh99QF6Wrn0c0OVmru25j0rbqpwl-3Ag";

        const allTeams = ["K-SOX팀", "개인정보보호팀", "건축TF", "경영기획팀", "구매지원팀", "글로벌소싱팀", "노사기획팀", "노사협력팀", "대외협력팀", "법무팀", "영업관리팀", "인사기획팀", "인재문화팀", "인재확보팀", "재정팀", "총무팀", "커뮤니케이션팀", "컴플라이언스팀", "투자기획팀", "한국조달팀", "회계팀"];
        let participatedTeams = new Set(); let allGalleryData = []; let currentDisplayCount = 0; const ITEMS_PER_PAGE = 4; 

        function initApp() {
            const teamSelect = document.getElementById('teamName');
            allTeams.sort().forEach(team => { const option = document.createElement('option'); option.value = team; option.textContent = team; teamSelect.appendChild(option); });
            renderParticipationModal(); loadGallery(); 
        }

        async function loadGallery() {
            if (!GET_URL || !GET_URL.trim().startsWith("http")) return;
            try {
                const response = await fetch(GET_URL.trim()); 
                if (!response.ok) throw new Error(`서버 에러 ${response.status}`);
                let data = await response.json();
                
                if (data && Array.isArray(data.value)) data = data.value;
                if (typeof data === 'string') data = JSON.parse(data);
                if (!Array.isArray(data)) throw new Error("데이터 구조 오류");
                
                allGalleryData = data;
                document.getElementById('galleryGrid').innerHTML = ''; 
                currentDisplayCount = 0;
                
                if (allGalleryData.length === 0) {
                    document.getElementById('galleryGrid').innerHTML = `<p class="col-span-full text-center text-slate-500 py-10 font-bold">아직 전시된 작품이 없습니다.<br>첫 번째 작가가 되어주세요!</p>`; return;
                }
                
                renderParticipationModal(); renderGalleryPage();
            } catch(e) {
                console.error(e);
                document.getElementById('galleryGrid').innerHTML = `<div class="col-span-full text-center text-rose-500 font-bold py-10">로딩 실패: ${e.message}</div>`;
            }
        }

        function renderGalleryPage() {
            const gallery = document.getElementById('galleryGrid');
            const loadMoreBtn = document.getElementById('loadMoreContainer');
            const nextBatch = allGalleryData.slice(currentDisplayCount, currentDisplayCount + ITEMS_PER_PAGE);

            function findData(obj, keywords) {
                for (let key of Object.keys(obj)) {
                    for (let kw of keywords) {
                        if (key.toLowerCase().includes(kw) && typeof obj[key] === 'string' && obj[key].trim() !== '') {
                            return obj[key];
                        }
                    }
                }
                return '';
            }

            nextBatch.forEach(item => {
                const valTitle = item.Title || findData(item, ['title', '제목']) || '제목 없음';
                const valTeam = findData(item, ['team', '팀', '소속']) || '팀 없음';
                const valAuthor = findData(item, ['author', '작성자', '이름', 'name']) || '작성자 미상';
                const valImage = findData(item, ['image', '사진', '그림', 'base64', 'imagedata']);

                if(valTeam !== '팀 없음') participatedTeams.add(valTeam);

                const fallbackSvg = encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="16" font-weight="bold" fill="#94a3b8">이미지 없음</text></svg>');
                const imgSrc = valImage ? `data:image/jpeg;base64,${valImage}` : `data:image/svg+xml;utf8,${fallbackSvg}`;
                
                const html = `
                    <div class="bg-white border rounded-2xl shadow-md p-4 flex flex-col">
                        <div class="mb-5 text-center">
                            <h3 class="comic-font text-xl mb-3 break-keep-words">${escapeHtml(valTitle)}</h3>
                            <div class="flex justify-center gap-2">
                                <span class="bg-indigo-600 text-white text-xs px-3 py-1 rounded-full">${escapeHtml(valTeam)}</span>
                                <span class="bg-slate-100 text-slate-700 text-xs px-3 py-1 rounded-full">${escapeHtml(valAuthor)}</span>
                            </div>
                        </div>
                        <div class="w-full bg-slate-100 rounded-xl overflow-hidden shrink-0"><img class="w-full h-auto block" src="${imgSrc}" alt="웹툰"></div>
                        <div class="mt-5 flex justify-between px-2"><button onclick="likeAction(this)" class="text-slate-400 hover:text-rose-500 font-bold"><i class="fa-solid fa-heart"></i> <span class="like-cnt">0</span></button></div>
                    </div>`;
                gallery.insertAdjacentHTML('beforeend', html);
            });

            renderParticipationModal();

            currentDisplayCount += nextBatch.length;
            if (currentDisplayCount >= allGalleryData.length) { loadMoreBtn.classList.add('hidden'); loadMoreBtn.classList.remove('flex'); } 
            else { loadMoreBtn.classList.remove('hidden'); loadMoreBtn.classList.add('flex'); }
        }

        function renderParticipationModal() {
            const pList = document.getElementById('participatedList'); const npList = document.getElementById('notParticipatedList');
            if(!pList || !npList) return;
            pList.innerHTML = ''; npList.innerHTML = ''; let pCount = 0, npCount = 0;
            allTeams.sort().forEach(team => {
                const badge = document.createElement('span');
                if (participatedTeams.has(team)) { pCount++; badge.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm bg-emerald-100 text-emerald-800'; badge.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${team}`; pList.appendChild(badge); } 
                else { npCount++; badge.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm bg-slate-100 text-slate-600'; badge.innerHTML = `<i class="fa-regular fa-clock"></i> ${team}`; npList.appendChild(badge); }
            });
            document.getElementById('participatedCount').textContent = pCount; document.getElementById('notParticipatedCount').textContent = npCount;
            if (pCount === 0) pList.innerHTML = `<p class="text-sm text-slate-400 w-full p-4 bg-slate-50 rounded-lg text-center border border-dashed">아직 참여한 팀이 없습니다.</p>`;
        }

        function openParticipationModal() { document.getElementById('participationModal').classList.remove('hidden'); document.getElementById('participationModal').classList.add('flex'); renderParticipationModal(); }
        function closeParticipationModal() { document.getElementById('participationModal').classList.add('hidden'); document.getElementById('participationModal').classList.remove('flex'); }
        function showMessage(text, type = "success") { const box = document.getElementById('messageBox'); document.getElementById('msgText').textContent = text; document.getElementById('msgIcon').className = type === "error" ? "fa-solid fa-circle-exclamation text-4xl mb-4 text-rose-500" : "fa-solid fa-circle-check text-4xl mb-4 text-emerald-500"; box.classList.remove('hidden'); box.classList.add('flex'); }
        function closeMessage() { document.getElementById('messageBox').classList.add('hidden'); document.getElementById('messageBox').classList.remove('flex'); }
        function escapeHtml(text) { if(!text) return ""; const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return String(text).replace(/[&<>"']/g, m => map[m]); }

        document.getElementById('comicForm').addEventListener('submit', async (e) => {
            e.preventDefault(); const btn = document.getElementById('generateBtn'); const overlay = document.getElementById('loadingOverlay');
            const title = document.getElementById('webtoonTitle').value.trim(); const team = document.getElementById('teamName').value; const author = document.getElementById('authorName').value.trim();
            if (!title) { showMessage("웹툰 제목을 입력해주세요.", "error"); return; } if (!team) { showMessage("소속 팀을 선택해주세요.", "error"); return; }
            const scenes = [], dialogues = []; for(let i=1; i<=4; i++) { scenes.push(document.getElementById(`scene${i}`).value.trim()); dialogues.push(document.getElementById(`dialogue${i}`).value.trim()); }
            btn.disabled = true; overlay.classList.remove('hidden'); overlay.classList.add('flex');
            try {
                const imagePromises = scenes.map(scene => generateImageWithRetry(scene)); const base64Images = await Promise.all(imagePromises);
                document.getElementById('previewTitle').textContent = title; document.getElementById('previewTeamLabel').textContent = team; document.getElementById('previewAuthorLabel').innerHTML = `<i class="fa-solid fa-user-pen mr-1"></i>${author}`;
                for(let i=0; i<4; i++){ document.getElementById(`preview-scene-${i+1}`).textContent = scenes[i]; document.getElementById(`preview-img-${i+1}`).src = base64Images[i]; document.getElementById(`preview-dialogue-${i+1}`).textContent = dialogues[i]; }
                document.getElementById('comicGrid').classList.remove('hidden'); document.getElementById('comicGrid').classList.add('flex'); document.getElementById('publishBtn').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
            } catch (error) { console.error(error); showMessage("그림 생성 오류", "error"); } finally { btn.disabled = false; overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
        });

        async function publishToGallery() {
            const comicElement = document.getElementById('comicGrid'); const title = document.getElementById('webtoonTitle').value.trim(); const team = document.getElementById('teamName').value; const author = document.getElementById('authorName').value.trim();
            showMessage("갤러리로 전송 중입니다..."); document.getElementById('publishBtn').disabled = true;
            try {
                const canvas = await html2canvas(comicElement, { scale: 1, backgroundColor: '#f8fafc' }); 
                const base64Data = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                
                const response = await fetch(POST_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, team, author, imageB64: base64Data }) });
                if (response.ok) { showMessage("성공적으로 전시되었습니다! 🎉"); await loadGallery(); document.getElementById('comicForm').reset(); document.getElementById('comicGrid').classList.add('hidden'); document.getElementById('comicGrid').classList.remove('flex'); document.getElementById('emptyState').classList.remove('hidden'); document.getElementById('publishBtn').classList.add('hidden'); } else throw new Error("서버 오류");
            } catch (error) { console.error(error); showMessage("전송 중 오류 발생", "error"); } finally { document.getElementById('publishBtn').disabled = false; }
        }

        function likeAction(btn) { const span = btn.querySelector('.like-cnt'); if(!btn.classList.contains('text-rose-500')) { span.textContent = parseInt(span.textContent) + 1; btn.classList.add('text-rose-500'); btn.classList.remove('text-slate-400'); } }

        async function generateImageWithRetry(sceneText, retries = 3) {
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${API_KEY}`;
            const fallbackStyle = "Masterpiece, trending high-quality Korean webtoon style, beautiful and attractive character design, bright and vivid colors, cel shading, highly readable and eye-catching composition, expressive emotions, modern office background. NO TEXT, NO WORDS, NO SPEECH BUBBLES. Situation: ";
            try {
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ "contents": [{ "parts": [{ "text": fallbackStyle + sceneText }] }], "generationConfig": { "responseModalities": ["IMAGE"], "imageConfig": { "aspectRatio": "1:1" } } }) });
                if (!response.ok) throw new Error("API Error"); const data = await response.json(); const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                if (part) return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`; throw new Error("No image data");
            } catch (error) { if (retries > 0) { await new Promise(res => setTimeout(res, 2000)); return generateImageWithRetry(sceneText, retries - 1); } else throw error; }
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
